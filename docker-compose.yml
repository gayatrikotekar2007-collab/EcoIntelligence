services:
  db:
    image: postgis/postgis:16-3.4
    container_name: ecointelligence-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecointelligence}
      POSTGRES_USER: ${POSTGRES_USER:-ecointelligence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-welcome}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecointelligence} -d ${POSTGRES_DB:-ecointelligence}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
